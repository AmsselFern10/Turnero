<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Pública de Turnos — Auditorio 1080p</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/animations.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="screen-fixed bg-app text-slate-800 flex flex-col justify-between p-6 pb-0 antialiased font-sans"
      x-data="tvView()" x-init="init()" x-cloak>

  <!-- ── 1. BANNER FLOTANTE DE RECONEXIÓN (RF-TV-05 / RNF-DIS-03) ── -->
  <aside x-show="reconnecting" x-cloak aria-live="polite"
         class="fixed top-0 inset-x-0 z-50 bg-amber-500 text-white px-8 py-2.5 shadow-lg flex items-center justify-between animate-toast-slide">
    <div class="flex items-center space-x-3">
      <svg class="w-5 h-5 animate-spin flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span class="font-medium text-sm" x-text="reconnectMsg"></span>
    </div>
    <span class="font-mono-num text-xs bg-amber-600/80 px-3 py-1 rounded-md font-semibold" x-text="reconnectCountdown"></span>
  </aside>

  <!-- ── 2. VIEWPORT PRINCIPAL 1080p (2 Columnas Asimétricas sin scroll) ── -->
  <main class="flex-1 w-full grid grid-cols-12 gap-6 pb-6 min-h-0">

    <!-- COLUMNA IZQUIERDA: HERO CARD CENTRAL (~65% / col-span-8) (RF-TV-01) -->
    <section class="col-span-8 bg-white border rounded-2xl p-8 shadow-sm flex flex-col justify-between h-full relative overflow-hidden transition-all duration-300"
             :class="{
               'pulse-call-blue border-blue-500 ring-4 ring-blue-500/20': glowState === 'nuevo',
               'pulse-call-amber border-amber-500 ring-4 ring-amber-500/20': glowState === 'rellamado',
               'border-[#CBD5E1]': glowState === 'idle'
             }">
      
      <!-- TOP: Banner de Anticipación de Fila -->
      <div class="w-full bg-amber-50 border border-amber-300 rounded-2xl px-6 py-4 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3 text-amber-900">
          <div class="p-2 bg-amber-100/80 rounded-xl border border-amber-200/90 text-amber-800 flex items-center justify-center">
            <svg class="w-6 h-6 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          </div>
          <div>
            <span class="block text-xs font-semibold text-amber-700 tracking-wider uppercase">Siguiente en Fila</span>
            <span class="font-bold text-base uppercase tracking-wider text-amber-950">PRÓXIMO TURNO EN ESPERA:</span>
          </div>
        </div>

        <div class="bg-amber-200/90 border border-amber-300 px-6 py-1.5 rounded-xl shadow-xs flex items-center justify-center">
          <span class="font-mono-num text-3xl font-black text-amber-950 tracking-tight" x-text="formatTicket(proximoNumero)">043</span>
        </div>

        <div class="flex items-center space-x-2 text-amber-800 font-semibold text-sm bg-amber-100/60 px-4 py-2 rounded-xl border border-amber-200/60">
          <svg class="w-4 h-4 stroke-[1.5] text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
          <span>(A prepararse)</span>
        </div>
      </div>

      <!-- CENTER: Turno Convocado Colosal (≥ 240px en JetBrains Mono Tabular) -->
      <div class="flex-1 flex flex-col items-center justify-center my-auto text-center py-4">
        <div class="flex items-center space-x-2 mb-2">
          <span class="h-2.5 w-2.5 rounded-full" :class="glowState === 'rellamado' ? 'bg-amber-500 animate-ping' : 'bg-blue-600 animate-ping'"></span>
          <span class="text-sm font-semibold uppercase tracking-[0.25em]"
                :class="glowState === 'rellamado' ? 'text-amber-700' : 'text-slate-500'"
                x-text="glowState === 'rellamado' ? 'RE-LLAMANDO TURNO (2º AVISO)' : (glowState === 'nuevo' ? 'NUEVO TURNO CONVOCADO' : 'TURNO ASIGNADO')">TURNO ASIGNADO</span>
        </div>
        <div class="font-mono-num font-bold text-slate-900 tracking-tighter leading-none select-none text-[240px] drop-shadow-xs"
             x-text="formatTicket(ultimoLlamado.numero)">042</div>
      </div>

      <!-- BOTTOM: Destino de Ventanilla en Azul Cobalto (#1D4ED8) -->
      <div class="w-full rounded-2xl p-6 px-8 flex items-center justify-between text-white shadow-lg transition-colors duration-300"
           :class="glowState === 'rellamado' ? 'bg-amber-600 border border-amber-500' : 'bg-[#1D4ED8] border border-blue-600/40'">
        <div class="flex items-center space-x-5">
          <div class="w-16 h-16 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center shadow-inner">
            <svg class="w-9 h-9 stroke-[1.5] text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
          </div>
          <div>
            <span class="block text-blue-100 text-xs font-semibold tracking-wider uppercase mb-0.5">Ubicación Asignada</span>
            <span class="font-bold text-3xl uppercase tracking-wider text-white">DIRÍJASE A</span>
          </div>
        </div>

        <div class="bg-white/10 border border-white/20 px-8 py-3 rounded-2xl flex items-center justify-center shadow-inner backdrop-blur-xs">
          <span class="font-mono-num font-bold text-[80px] leading-none text-white tracking-wide" x-text="formatMesa(ultimoLlamado)">MESA 3</span>
        </div>
      </div>

    </section>

    <!-- COLUMNA DERECHA: HISTORIAL DINÁMICO FIFO (~35% / col-span-4) (RF-TV-02) -->
    <section class="col-span-4 flex flex-col justify-between h-full space-y-4">
      <div class="bg-white border border-[#CBD5E1] rounded-2xl px-6 py-4 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3 text-slate-800">
          <svg class="w-5 h-5 text-blue-700 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <h2 class="font-bold text-sm tracking-wide uppercase text-slate-900">TURNOS ANTERIORES EN ATENCIÓN</h2>
        </div>
        <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">Últimos 4</span>
      </div>

      <!-- 4 Ranuras Fijas del Historial (FIFO) -->
      <div class="flex-1 flex flex-col justify-between gap-4">
        <template x-for="i in [0, 1, 2, 3]" :key="i">
          <div class="flex-1 bg-white border border-[#CBD5E1] rounded-2xl px-8 py-4 flex items-center justify-between shadow-xs transition-opacity duration-300"
               :class="{ 'opacity-40': !historial[i] }">
            <div class="font-mono-num font-bold text-[46px] text-slate-900 tracking-tight"
                 x-text="historial[i] ? formatTicket(historial[i].numero) : '--'">041</div>
            <div class="flex items-center space-x-5">
              <span class="font-mono-num font-bold text-lg bg-blue-50 text-blue-700 border border-blue-200 px-5 py-2 rounded-xl shadow-2xs"
                    x-text="historial[i] ? (historial[i].mesa_nombre || 'Mesa ' + (historial[i].mesa_numero || '--')) : '--'">Mesa 1</span>
              <div class="flex items-center space-x-1.5 text-slate-500 text-sm font-medium">
                <svg class="w-4 h-4 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span x-text="historial[i] ? historial[i].tiempoRelativo : 'En espera'">Hace 1 min</span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

  </main>

  <!-- ── 3. FOOTER INFORMATIVO Y RELOJ DIGITAL EN VIVO (RF-TV-03) ── -->
  <footer class="w-full bg-white border-t border-[#CBD5E1] -mx-6 px-8 py-3 flex items-center justify-between text-sm shadow-xs relative z-20">
    <div class="flex items-center space-x-3 text-slate-600">
      <div class="p-1 rounded-full bg-blue-50 text-blue-700">
        <svg class="w-5 h-5 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" /></svg>
      </div>
      <p class="font-medium text-slate-700">Por favor, diríjase a la ventanilla indicada portando su comprobante de matrícula.</p>
    </div>

    <div class="flex items-center space-x-6 text-slate-700">
      <div class="flex items-center space-x-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full" :class="wsConnected ? 'bg-emerald-400 opacity-75' : 'bg-amber-400 opacity-75'"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5" :class="wsConnected ? 'bg-emerald-600' : 'bg-amber-500'"></span>
        </span>
        <span class="text-xs font-semibold text-slate-600 tracking-wide" x-text="wsConnected ? 'Sistema Sincronizado' : 'Reconectando...'">Sistema Sincronizado</span>
      </div>
      <div class="h-4 w-px bg-slate-300"></div>
      <div class="flex items-center space-x-2 font-mono-num font-bold text-slate-900 text-base">
        <svg class="w-4 h-4 text-slate-500 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span x-text="relojHora">--:--:--</span>
      </div>
      <div class="h-4 w-px bg-slate-300"></div>
      <span class="text-xs font-medium text-slate-600" x-text="relojFecha">--</span>
    </div>
  </footer>

  <!-- Scripts al final del body -->
  <script type="module" src="/js/pages/tv.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</body>
</html>
