<!DOCTYPE html>
<html lang="es" class="h-full w-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Publica de Turnos - Auditorio</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/tv-tokens.css">
  <link rel="icon" href="data:,">
</head>

<body
  class="screen-fixed bg-app text-slate-800 flex flex-col justify-between antialiased font-sans m-0 p-0 overflow-hidden">

  <noscript>
    <div class="fixed inset-0 bg-app flex items-center justify-center text-slate-800 text-2xl font-sans">
      Iniciando sistema de turnos... (JavaScript requerido)
    </div>
  </noscript>

  <!-- Alpine.js se carga; mientras tanto mostrar estado inicial neutro -->
  <div id="tv-root" x-data="tvView" class="contents" :style="estilosRootVariables">

    <!-- 1. BANNER FLOTANTE DE RECONEXION (RF-TV-05 / RNF-DIS-03) -->
    <!-- Gracia de 3s: aparece solo si la desconexion dura mas de 3s -->
    <aside x-show="reconnecting" x-cloak aria-live="polite" class="banner-reconnect animate-toast-slide">
      <div class="flex items-center space-x-3">
        <svg class="w-5 h-5 animate-spin flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="font-medium text-sm" x-text="reconnectMsg"></span>
      </div>
      <span class="font-mono-num text-xs bg-amber-600/80 px-3 py-1 rounded-md font-semibold"
        x-text="reconnectCountdown"></span>
    </aside>

    <!-- 2. AVISO DE AUDIO BLOQUEADO (visible solo si audioSuspended y sin gesto previo) -->
    <div x-show="audioSuspended" x-cloak
      class="fixed bottom-20 right-6 z-40 bg-slate-800/90 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg backdrop-blur-sm cursor-pointer select-none"
      @click="desbloquearAudio()">
      <span>Toque la pantalla para activar el sonido</span>
    </div>

    <!-- 3. AVISO VOZ BLOQUEADA POR EL NAVEGADOR (voz activa pero el navegador la bloquea) -->
    <div x-show="vozActiva && vozBloqueada" x-cloak
      class="fixed bottom-8 right-6 z-40 bg-amber-700/90 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg backdrop-blur-sm select-none flex items-center gap-2"
      title="El navegador requiere una interacción del usuario para habilitar la voz. Haga clic en cualquier lugar de la pantalla para activarla.">
      <svg class="w-3.5 h-3.5 stroke-[2] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
      </svg>
      <span>Voz bloqueada &mdash; toque la pantalla para activar</span>
    </div>

    <!-- 3. VIEWPORT PRINCIPAL RESPONSIVO (RF-TV-01 / RF-TV-02) -->
    <main class="flex-1 w-full tv-main-grid min-h-0 p-4 sm:p-5 md:p-6" :class="{ 'solo-hero': !mostrarHistorial }">

      <!-- COLUMNA IZQUIERDA: HERO CARD CENTRAL (~65% o 100% si historial está oculto) -->
      <section class="card-hero tv-col-hero p-5 md:p-8 relative overflow-hidden transition-colors duration-300 min-w-0"
        :class="{
                 'pulse-call-blue border-blue-500 ring-4 ring-blue-500/20': glowState === 'nuevo',
                 'pulse-call-amber border-amber-500 ring-4 ring-amber-500/20': glowState === 'rellamado',
                 'border-slate-300': glowState === 'idle'
               }"
        :style="estiloFondoPrincipal">

        <!-- Insignia "+N en cola" (aparece solo con cola) -->
        <div x-show="colaPendiente > 0" x-cloak
          class="absolute top-3 md:top-4 right-3 md:right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow"
          x-text="'+' + colaPendiente + ' en cola'"></div>

        <!-- TOP: Banner Proximo Turno en Espera (Compacto y centrado en la parte superior) -->
        <div class="w-full flex justify-center flex-shrink-0">
          <div x-show="proximoNumero !== null"
            class="tv-hero-callout w-fit max-w-[95%] bg-blue-50/50 border border-blue-200/90 rounded-2xl px-6 sm:px-7 md:px-8 py-3 sm:py-3.5 md:py-4 flex items-center shadow-xs min-w-0 gap-3.5 sm:gap-4.5 md:gap-5 transition-opacity duration-200"
            :class="{ '!bg-amber-50/80 !border-amber-300': glowState === 'rellamado' }">
            <div class="flex items-center space-x-2.5 sm:space-x-3.5 min-w-0">
              <div
                class="p-2 sm:p-2.5 bg-blue-100/80 border border-blue-200/90 text-blue-700 rounded-xl flex items-center justify-center flex-shrink-0"
                :class="{ '!bg-amber-100 !border-amber-300 !text-amber-700': glowState === 'rellamado' }">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 stroke-[1.8]" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <div class="min-w-0">
                <span
                  class="block text-xs font-bold text-slate-500 tracking-wider uppercase whitespace-nowrap">Siguiente en fila</span>
                <span
                  class="font-extrabold text-xs sm:text-sm md:text-base uppercase tracking-wide text-slate-900 whitespace-nowrap">Próximo en espera:</span>
              </div>
            </div>
            <div
              class="bg-white border-2 border-blue-300/80 px-4 sm:px-6 py-1.5 sm:py-2.5 rounded-xl shadow-xs flex items-center justify-center flex-shrink-0"
              :class="{ '!border-amber-400': glowState === 'rellamado' }">
              <span class="tv-prox-num font-mono-num font-black text-blue-700 tracking-tight whitespace-nowrap"
                :class="{ '!text-amber-700': glowState === 'rellamado' }" x-text="formatTicket(proximoNumero)">--</span>
            </div>
          </div>
        </div>

        <!-- BLOQUE CENTRAL AGRUPADO: Turno Asignado + Número Colosal + Mesa Asignada -->
        <div class="flex-1 flex flex-col items-center justify-center text-center my-auto py-2 sm:py-3 min-w-0">
          <div class="flex items-center space-x-2 mb-1 sm:mb-2 flex-shrink-0">
            <span class="h-2.5 w-2.5 rounded-full flex-shrink-0"
              :class="glowState === 'rellamado' ? 'bg-amber-500 animate-ping' : (glowState === 'nuevo' ? 'bg-blue-600 animate-ping' : 'bg-blue-600')"></span>
            <span class="text-xs sm:text-sm font-semibold uppercase tracking-[0.25em] whitespace-nowrap text-slate-400"
              x-text="glowState === 'rellamado' ? 'RE-LLAMANDO TURNO (SEGUNDO AVISO)' : (glowState === 'nuevo' ? 'NUEVO TURNO CONVOCADO' : 'TURNO ASIGNADO')">TURNO
              ASIGNADO</span>
          </div>
          <!-- Numero colosal con escala dinámica y auto-ajuste anti-desborde -->
          <div
            class="tv-ticket font-mono-num font-bold text-slate-900 tracking-tighter select-none drop-shadow-xs whitespace-nowrap"
            x-text="formatTicket(ultimoLlamado.numero)">--</div>

          <!-- BANNER DIRÍJASE A MESA X (Justo debajo del número, ancho ajustado a su contenido, centrado) -->
          <div
            class="tv-hero-bottom w-fit max-w-[95%] rounded-2xl py-3.5 sm:py-4.5 md:py-5.5 px-6 sm:px-8 md:px-10 flex items-center justify-center shadow-xs transition-colors duration-300 min-w-0 gap-3.5 sm:gap-4.5 md:gap-6 mt-3 sm:mt-5 md:mt-6"
            :class="{ '!bg-amber-50/80 !border-amber-300': glowState === 'rellamado' }">
            <div
              class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-xl bg-blue-100/90 border border-blue-200/90 flex items-center justify-center shadow-xs flex-shrink-0"
              :class="{ '!bg-amber-100 !border-amber-300 !text-amber-700': glowState === 'rellamado' }">
              <svg class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 stroke-[1.8] text-blue-700"
                :class="{ '!text-amber-700': glowState === 'rellamado' }" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
              </svg>
            </div>
            <span
              class="tv-banner-text font-bold text-lg sm:text-xl md:text-2xl lg:text-3xl uppercase tracking-wider text-slate-700 whitespace-nowrap flex-shrink-0">DIRÍJASE
              A</span>
            <div class="h-8 sm:h-10 md:h-12 w-0.5 bg-slate-300/80 mx-1 flex-shrink-0"
              :class="{ '!bg-amber-300': glowState === 'rellamado' }"></div>
            <span
              class="tv-mesa font-mono-num font-black leading-none text-blue-700 tracking-wide whitespace-nowrap flex-shrink-0"
              :class="{ '!text-amber-700': glowState === 'rellamado' }" x-text="formatMesa(ultimoLlamado)">MESA
              --</span>
          </div>
        </div>

      </section>

      <!-- COLUMNA DERECHA: HISTORIAL DINAMICO FIFO (~35% o se oculta) (RF-TV-02) -->
      <section x-show="mostrarHistorial" x-cloak class="tv-col-historial min-w-0">
        <div
          class="tv-hist-header bg-white border border-slate-300 rounded-2xl px-4 sm:px-6 py-2.5 sm:py-3.5 flex items-center justify-between shadow-xs flex-shrink-0 min-w-0">
          <div class="flex items-center space-x-2.5 sm:space-x-3 text-slate-800 min-w-0">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-blue-700 stroke-[1.5] flex-shrink-0" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2 class="font-bold text-xs sm:text-sm tracking-wide uppercase text-slate-900 whitespace-nowrap">TURNOS
              ANTERIORES</h2>
          </div>
          <span
            class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 sm:px-3 py-0.5 sm:py-1 rounded-full border border-slate-200 whitespace-nowrap flex-shrink-0">Últimos
            4</span>
        </div>

        <!-- 4 Ranuras Fijas del Historial (FIFO) -->
        <div class="tv-hist-grid">
          <template x-for="i in [0, 1, 2, 3]" :key="i">
          <div
              class="card bg-white flex-1 px-4 sm:px-5 md:px-6 py-2 sm:py-3 flex items-center justify-between min-w-0 overflow-hidden gap-3"
              :style="estiloFondoSecundario">
              <!-- Número de turno en historial -->
              <div
                class="tv-hist-num font-mono-num font-bold text-slate-900 tracking-tight flex-shrink-0 whitespace-nowrap transition-colors"
                :class="{ 'text-slate-300': !historial[i] }"
                x-text="historial[i] ? formatTicket(historial[i].numero) : '--'">--</div>

              <!-- Mesa e indicador de tiempo armónico y proporcionado -->
              <div class="flex items-center space-x-2 sm:space-x-3 min-w-0 ml-2 transition-opacity"
                :class="{ 'opacity-40': !historial[i] }">
                <span class="tv-hist-mesa font-mono-num font-bold whitespace-nowrap flex-shrink-0"
                  x-text="historial[i] ? ('MESA ' + historial[i].mesa_numero) : '--'">--</span>
                <div
                  class="flex items-center space-x-1 sm:space-x-1.5 text-slate-500 text-xs sm:text-sm font-medium whitespace-nowrap flex-shrink-0">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 stroke-[1.5] flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span class="whitespace-nowrap" x-text="historial[i] ? historial[i].tiempoRelativo : 'En espera'">En
                    espera</span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </section>

    </main>

    <!-- 4. FOOTER FLUSH AL BORDE INFERIOR (RF-TV-03 / RF-TV-FOOTER) -->
    <footer
      class="app-footer w-full px-4 sm:px-6 md:px-8 py-2 sm:py-2.5 flex items-center justify-between text-xs sm:text-sm relative z-20 flex-shrink-0">
      <div class="flex items-center space-x-2">
        <!-- Enlace discreto a inicio de sesión -->
        <a href="/index.html"
          class="inline-flex items-center justify-center p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 active:scale-[0.98] transition-all cursor-pointer select-none"
          aria-label="Volver al inicio de sesión" title="Volver al inicio de sesión">
          <svg class="w-5 h-5 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
        </a>

        <div class="h-4 w-px bg-slate-300"></div>

        <!-- Botón discreto para alternar visibilidad de los últimos 4 turnos atendidos -->
        <button type="button" @click="toggleHistorial()"
          class="inline-flex items-center justify-center p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 active:scale-[0.98] transition-all cursor-pointer select-none"
          :class="{ 'text-blue-700 bg-blue-50 hover:bg-blue-100/70': !mostrarHistorial }"
          :aria-label="mostrarHistorial ? 'Ocultar turnos anteriores' : 'Mostrar turnos anteriores'"
          :title="mostrarHistorial ? 'Ocultar turnos anteriores (pantalla completa para turno principal)' : 'Mostrar turnos anteriores'">
          <!-- Icono SVG representativo de columnas/paneles -->
          <svg class="w-5 h-5 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 4.5v15m-5.25-15h16.5a1.5 1.5 0 011.5 1.5v12a1.5 1.5 0 01-1.5 1.5H3.75a1.5 1.5 0 01-1.5-1.5v-12a1.5 1.5 0 011.5-1.5z" />
          </svg>
          <span class="sr-only"
            x-text="mostrarHistorial ? 'Ocultar turnos anteriores' : 'Mostrar turnos anteriores'">Alternar turnos
            anteriores</span>
        </button>
      </div>

      <div class="flex items-center space-x-3 sm:space-x-5 md:space-x-6 text-slate-700">
        <!-- Indicador de conexion WS -->
        <div class="flex items-center space-x-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full"
              :class="wsConnected ? 'bg-emerald-400 opacity-75' : 'bg-amber-400 opacity-75'"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5"
              :class="wsConnected ? 'bg-emerald-600' : 'bg-amber-500'"></span>
          </span>
          <span class="text-xs font-semibold text-slate-600 tracking-wide hidden sm:inline"
            x-text="wsConnected ? 'Sistema Sincronizado' : 'Reconectando...'">Sistema Sincronizado</span>
        </div>
        <div class="h-4 w-px bg-slate-300"></div>
        <!-- Botón e indicador de Voz TV -->
        <button type="button" @click="toggleVoz()"
          class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg border text-xs font-semibold cursor-pointer transition-colors"
          title="Control de voz de anuncios"
          aria-label="Control de voz de anuncios"
          :aria-label="vozActiva ? 'Silenciar voz del televisor' : 'Activar voz del televisor'"
          :title="vozActiva ? 'Silenciar voz del televisor' : 'Activar voz del televisor'">
          <svg x-show="vozActiva" class="w-3.5 h-3.5 stroke-[2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.757 3.63 8.25 4.51 8.25H6.75z" />
          </svg>
          <svg x-show="!vozActiva" class="w-3.5 h-3.5 stroke-[2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-1.5l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.757 3.63 8.25 4.51 8.25H6.75z" />
          </svg>
          <span class="hidden md:inline" x-text="vozActiva ? 'Voz TV' : 'Voz silenciada'"></span>
        </button>
        <div class="h-4 w-px bg-slate-300"></div>
        <!-- Reloj -->
        <div
          class="flex items-center space-x-1.5 sm:space-x-2 font-mono-num font-bold text-slate-900 text-sm sm:text-base">
          <svg class="w-4 h-4 text-slate-500 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span x-text="relojHora">--:--:--</span>
        </div>
        <div class="h-4 w-px bg-slate-300 hidden sm:block"></div>
        <span class="text-xs font-medium text-slate-600 hidden sm:inline" x-text="relojFecha">--</span>
      </div>
    </footer>

  </div><!-- fin #tv-root -->

  <!-- Módulo primero: registra el listener alpine:init antes de que Alpine arranque -->
  <script type="module" src="/js/pages/tv.js"></script>
  <!-- Alpine con defer: carga tras el HTML, dispara alpine:init y encuentra tvView ya registrado -->
  <script defer src="/vendor/alpine-3.13.3.min.js"></script>
</body>

</html>
