<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosko de Autoservicio • Turnero de Matrículas 2026</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js v3 CDN (Reactividad ligera sin build step) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            cobalt: {
              DEFAULT: '#1D4ED8',
              hover: '#1E40AF',
              light: '#EFF6FF',
              border: '#BFDBFE',
            },
            app: {
              bg: '#EEF2F6',
              card: '#FFFFFF',
              border: '#CBD5E1',
            }
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(15, 23, 42, 0.05)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #EEF2F6;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: "tnum" 1;
    }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="{
  step: 'ticket', // 'welcome' | 'ticket'
  ticketNumber: 47,
  waitingAhead: 3,
  estimatedMinutes: 10,
  isGenerating: false,
  isPrinting: false,
  showToast: false,
  toastMessage: '',
  generateTicket() {
    this.isGenerating = true;
    setTimeout(() => {
      this.ticketNumber = this.ticketNumber + 1;
      this.waitingAhead = Math.floor(Math.random() * 4) + 2;
      this.estimatedMinutes = this.waitingAhead * 3;
      this.isGenerating = false;
      this.step = 'ticket';
      this.showToastNotification('Turno #' + String(this.ticketNumber).padStart(3, '0') + ' emitido correctamente');
    }, 450);
  },
  printTicket() {
    this.isPrinting = true;
    setTimeout(() => {
      this.isPrinting = false;
      this.showToastNotification('Comprobante enviado a imprimir');
    }, 600);
  },
  showToastNotification(msg) {
    this.toastMessage = msg;
    this.showToast = true;
    setTimeout(() => { this.showToast = false; }, 3000);
  }
}" class="min-h-full flex flex-col justify-between bg-[#EEF2F6] antialiased text-slate-800 selection:bg-blue-100 selection:text-blue-900">

  <!-- ================= TOP HEADER COMPACTO INSTITUCIONAL ================= -->
  <header class="w-full max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- Identidad Institucional sutil con Escudo SVG -->
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-white border border-[#CBD5E1] shadow-xs flex items-center justify-center text-[#1D4ED8]">
        <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L3 7v6c0 5.25 3.75 10.15 9 11.35 5.25-1.2 9-6.1 9-11.35V7l-9-5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v5"></path>
          <circle cx="12" cy="16" r="1" fill="currentColor"></circle>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-slate-900 leading-none">Matrículas 2026</h1>
        <p class="text-xs text-slate-500 font-medium mt-1">Autoservicio • Kiosko de Portón</p>
      </div>
    </div>

    <!-- Píldora de Conexión en Tiempo Real -->
    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-white border border-slate-200 shadow-xs">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-xs font-medium text-slate-700">En línea • Sincronizado</span>
    </div>
  </header>

  <!-- ================= CANVAS CENTRAL (Centrado Absoluto y Cero Ruido) ================= -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="max-w-md w-full bg-white rounded-2xl border border-[#CBD5E1] shadow-xs p-8 text-center transition-all duration-300">

      <!-- ================= VISTA 1: BIENVENIDA / SOLICITAR TURNO ================= -->
      <template x-if="step === 'welcome'">
        <div class="space-y-6">
          <div class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-blue-50 border border-blue-200">
            <span class="text-xs font-semibold text-[#1D4ED8] tracking-wider uppercase">Recepción de Estudiantes</span>
          </div>

          <div class="space-y-2">
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Bienvenido al Proceso de Matrícula</h2>
            <p class="text-xs text-slate-500 leading-relaxed max-w-xs mx-auto">
              Presiona el botón para obtener tu ticket correlativo de atención en ventanillas.
            </p>
          </div>

          <!-- Métricas de la fila previa a tomar el turno -->
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex items-center justify-around text-xs text-slate-700 font-medium">
            <div class="flex items-center space-x-2">
              <svg class="w-4 h-4 text-slate-400 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Espera estimada: ~10 min</span>
            </div>
            <span class="text-slate-300">•</span>
            <div class="flex items-center space-x-2">
              <svg class="w-4 h-4 text-slate-400 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <span>8 Mesas operativas</span>
            </div>
          </div>

          <!-- Botón Gigante Táctil de 1 Toque -->
          <button 
            @click="generateTicket()" 
            :disabled="isGenerating"
            class="h-16 w-full rounded-xl font-bold text-white text-base shadow-xs bg-[#1D4ED8] hover:bg-blue-800 active:scale-[0.98] transition-all flex items-center justify-center space-x-2.5 cursor-pointer disabled:opacity-75 disabled:cursor-wait">
            <template x-if="!isGenerating">
              <div class="flex items-center space-x-2.5">
                <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
                </svg>
                <span>TOMAR MI TURNO</span>
              </div>
            </template>
            <template x-if="isGenerating">
              <div class="flex items-center space-x-2">
                <svg class="w-5 h-5 animate-spin stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                  <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
                </svg>
                <span>ASIGNANDO TURNO...</span>
              </div>
            </template>
          </button>

          <p class="text-[11px] text-slate-400">
            Tu número correlativo se reserva al instante en el lote oficial del día.
          </p>
        </div>
      </template>

      <!-- ================= VISTA 2: TICKET GENERADO / COMPROBANTE ================= -->
      <template x-if="step === 'ticket'">
        <div>
          <!-- Badge Superior de Asignación -->
          <div class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-slate-100 border border-slate-200">
            <span class="text-xs uppercase font-semibold text-slate-500 tracking-wider">Tu Turno Asignado</span>
          </div>

          <!-- Número de Turno Colosal (JetBrains Mono) -->
          <div class="my-4">
            <span class="font-mono text-7xl font-extrabold text-slate-900 tracking-tight block select-all" x-text="'#' + String(ticketNumber).padStart(3, '0')">#047</span>
            <div class="mt-1 flex items-center justify-center space-x-1.5 text-xs text-slate-500 font-medium">
              <span>Módulo General de Matrículas</span>
              <span>•</span>
              <span class="font-mono font-semibold text-[#1D4ED8]">MESA ASIGNADA</span>
            </div>
          </div>

          <!-- Bloque de Métricas Esenciales en 2 Columnas -->
          <div class="grid grid-cols-2 divide-x divide-slate-200 bg-slate-50 border border-slate-200 rounded-xl py-3 px-2 mb-6">
            <!-- Columna 1: Turnos antes -->
            <div class="flex flex-col items-center justify-center px-3">
              <div class="flex items-center space-x-1.5 text-slate-800 font-semibold text-xs">
                <svg class="w-4 h-4 text-slate-500 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                </svg>
                <span x-text="waitingAhead + ' turnos antes'">3 turnos antes</span>
              </div>
              <span class="text-[11px] text-slate-400 mt-0.5">En cola previa</span>
            </div>

            <!-- Columna 2: Tiempo estimado -->
            <div class="flex flex-col items-center justify-center px-3">
              <div class="flex items-center space-x-1.5 text-slate-800 font-semibold text-xs">
                <svg class="w-4 h-4 text-slate-500 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="'Espera: ~' + estimatedMinutes + ' min'">Espera: ~10 min</span>
              </div>
              <span class="text-[11px] text-slate-400 mt-0.5">Tiempo estimado</span>
            </div>
          </div>

          <!-- Contenedor QR Vectorial Nítido -->
          <div class="flex flex-col items-center justify-center p-4 bg-slate-50/70 rounded-xl border border-dashed border-slate-300 mb-6">
            <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-xs">
              <!-- QR Vectorial Puro de Alta Fidelidad -->
              <svg class="w-28 h-28 text-slate-900" fill="currentColor" viewBox="0 0 120 120">
                <!-- Marcador Superior Izquierdo -->
                <rect x="10" y="10" width="30" height="30" fill="none" stroke="currentColor" stroke-width="6"></rect>
                <rect x="20" y="20" width="10" height="10"></rect>
                <!-- Marcador Superior Derecho -->
                <rect x="80" y="10" width="30" height="30" fill="none" stroke="currentColor" stroke-width="6"></rect>
                <rect x="90" y="20" width="10" height="10"></rect>
                <!-- Marcador Inferior Izquierdo -->
                <rect x="10" y="80" width="30" height="30" fill="none" stroke="currentColor" stroke-width="6"></rect>
                <rect x="20" y="90" width="10" height="10"></rect>
                <!-- Patrón de Datos QR -->
                <rect x="48" y="12" width="6" height="6"></rect>
                <rect x="58" y="18" width="6" height="6"></rect>
                <rect x="68" y="12" width="6" height="6"></rect>
                <rect x="48" y="28" width="6" height="6"></rect>
                <rect x="62" y="28" width="6" height="6"></rect>
                <rect x="12" y="48" width="6" height="6"></rect>
                <rect x="24" y="58" width="6" height="6"></rect>
                <rect x="18" y="68" width="6" height="6"></rect>
                <rect x="48" y="48" width="8" height="8"></rect>
                <rect x="60" y="48" width="8" height="8"></rect>
                <rect x="72" y="52" width="6" height="6"></rect>
                <rect x="84" y="48" width="8" height="8"></rect>
                <rect x="98" y="52" width="6" height="6"></rect>
                <rect x="52" y="62" width="6" height="6"></rect>
                <rect x="66" y="62" width="8" height="8"></rect>
                <rect x="80" y="66" width="6" height="6"></rect>
                <rect x="94" y="62" width="8" height="8"></rect>
                <rect x="48" y="82" width="8" height="8"></rect>
                <rect x="62" y="82" width="6" height="6"></rect>
                <rect x="74" y="86" width="6" height="6"></rect>
                <rect x="86" y="82" width="8" height="8"></rect>
                <rect x="52" y="96" width="6" height="6"></rect>
                <rect x="66" y="98" width="8" height="8"></rect>
                <rect x="80" y="96" width="6" height="6"></rect>
                <rect x="96" y="98" width="8" height="8"></rect>
              </svg>
            </div>
            <p class="text-xs text-slate-600 font-medium mt-2.5">
              Escanea para seguir tu turno en vivo
            </p>
          </div>

          <!-- Botón Principal de Acción (Imprimir / Descargar) -->
          <button 
            @click="printTicket()" 
            :disabled="isPrinting"
            class="h-14 w-full rounded-xl font-semibold text-white text-sm shadow-xs bg-[#1D4ED8] hover:bg-blue-800 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 cursor-pointer disabled:opacity-75 mb-3">
            <template x-if="!isPrinting">
              <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24-1.076-.673-2.13-1.27-3.104m0 0A9.015 9.015 0 0112 4.5a9.015 9.015 0 016.55 6.225m-13.1 0l.448.243a4.5 4.5 0 005.102 0l.448-.243m0 0a9.015 9.015 0 016.55-6.225m0 0c-.597.974-1.03 2.028-1.27 3.104" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-18 0A2.25 2.25 0 015.25 14.25h13.5A2.25 2.25 0 0121 16.5m-18 0h18" />
                </svg>
                <span>GUARDAR O IMPRIMIR TICKET</span>
              </div>
            </template>
            <template x-if="isPrinting">
              <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 animate-spin stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                  <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
                </svg>
                <span>PROCESANDO TICKET...</span>
              </div>
            </template>
          </button>

          <!-- Acciones Secundarias Discretas -->
          <div class="flex items-center justify-center space-x-3 text-xs font-medium text-slate-500 mb-5">
            <button @click="generateTicket()" type="button" class="hover:text-[#1D4ED8] transition-colors py-1 cursor-pointer">
              Generar otro ticket
            </button>
            <span class="text-slate-300">•</span>
            <button @click="step = 'welcome'" type="button" class="hover:text-slate-800 transition-colors py-1 cursor-pointer">
              Pantalla de inicio
            </button>
          </div>

          <!-- Divisoria sutil y mensaje de orientación presencial -->
          <div class="border-t border-slate-200 pt-4">
            <p class="text-xs text-slate-500 leading-relaxed">
              Por favor toma asiento en el auditorio. Tu turno será anunciado en pantalla de TV y audio de voz.
            </p>
          </div>
        </div>
      </template>

    </div>
  </main>

  <!-- ================= FOOTER DISCRETO ================= -->
  <footer class="w-full max-w-4xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
    <div class="flex items-center space-x-2">
      <span>Universidad Nacional</span>
      <span class="text-slate-300">•</span>
      <span>Turnero de Admisiones y Matrículas 2026</span>
      <span class="text-slate-300">•</span>
      <span class="font-mono font-semibold text-slate-700">v2.1</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
      <span class="font-mono text-slate-600">WebSocket Activo (8ms)</span>
    </div>
  </footer>

  <!-- ================= NOTIFICACIÓN TOAST FLOTANTE ================= -->
  <div 
    x-cloak 
    x-show="showToast" 
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform translate-y-4"
    x-transition:enter-end="opacity-100 transform translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform translate-y-0"
    x-transition:leave-end="opacity-0 transform translate-y-4"
    class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 border border-slate-800 pointer-events-none">
    <svg class="w-4 h-4 text-emerald-400 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <div class="text-xs">
      <p class="font-semibold text-white" x-text="toastMessage"></p>
      <p class="text-slate-400 text-[11px]">Sincronizado con nodo central</p>
    </div>
  </div>

</body>
</html>
