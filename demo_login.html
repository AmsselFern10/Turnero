<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Turnero - Matrículas 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex items-center justify-center p-6 select-none">

  <!-- TARJETA PRINCIPAL DE LOGIN DE OPERADORES -->
  <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 max-w-lg w-full shadow-xl space-y-6">
    
    <!-- CABECERA INSTITUCIONAL -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto shadow-md">
        IT
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">ACCESO DE OPERADORES</h1>
      <p class="text-xs text-slate-400 font-medium">Módulo Central de Matrículas 2026 • Servidor Local</p>
    </div>

    <!-- FORMULARIO DE INGRESO DEL OPERADOR -->
    <form id="formLogin" onsubmit="procesarLoginOperador(event)" class="space-y-4">
      
      <!-- 1. USUARIO -->
      <div>
        <label for="inputUsuario" class="block text-xs font-black uppercase text-slate-500 mb-1.5">
          Usuario Operador:
        </label>
        <input type="text" id="inputUsuario" required placeholder="Ej: rmorales" value="rmorales" class="w-full bg-slate-50 border border-slate-300 rounded-2xl py-3 px-4 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
      </div>

      <!-- 2. CONTRASEÑA -->
      <div>
        <label for="inputPassword" class="block text-xs font-black uppercase text-slate-500 mb-1.5">
          Contraseña:
        </label>
        <input type="password" id="inputPassword" required placeholder="••••••••" value="123456" class="w-full bg-slate-50 border border-slate-300 rounded-2xl py-3 px-4 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
      </div>

      <!-- 3. SELECCIÓN DE MESA (SOPORTA 10, 12 O MÁS MESAS CON TOTAL FLEXIBILIDAD) -->
      <div class="pt-2 border-t border-slate-100">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-black uppercase text-slate-500">¿En qué mesa te sientas hoy?</label>
          <span class="text-[10px] text-slate-400 font-medium">Mesa elegida: <strong id="tagMesaElegida" class="text-blue-600 font-mono">MESA 3</strong></span>
        </div>

        <!-- GRILLA FLEXIBLE DE MESAS CON SCROLL SUAVE SI HAY MÁS DE 10 -->
        <div class="grid grid-cols-4 gap-2 text-center max-h-48 overflow-y-auto p-1" id="grillaMesasLogin">
          <!-- Renderizado dinámico de 1 a 12 mesas -->
        </div>
      </div>

      <!-- BOTÓN INGRESAR -->
      <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-black text-sm rounded-2xl shadow-md transition flex items-center justify-center space-x-2 mt-4">
        <span>🚀 INGRESAR Y ABRIR MESA</span>
      </button>

    </form>

    <!-- ZONA INFERIOR: ACCESO ADMINISTRACIÓN Y PANTALLA TV -->
    <div class="pt-4 border-t border-slate-100 space-y-3">
      
      <!-- BOTÓN MODAL ADMINISTRACIÓN -->
      <button onclick="abrirModalAdmin()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs rounded-2xl border border-slate-200 transition flex items-center justify-center space-x-2 shadow-sm">
        <span>🔐</span>
        <span>Acceso a Administración y Supervisión</span>
      </button>

      <!-- ENLACE DIRECTO PANTALLA TV -->
      <div class="text-center pt-1">
        <a href="demo_pantalla_tv.html" class="text-xs text-blue-600 hover:underline font-bold inline-flex items-center space-x-1.5">
          <span>📺</span>
          <span>Abrir Pantalla Pública de TV (Sala de Espera)</span>
        </a>
      </div>

    </div>

  </div>

  <!-- MESSAGE BOX / MODAL DE LOGIN DE ADMINISTRADOR -->
  <div id="modalLoginAdmin" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-3xl p-7 max-w-sm w-full shadow-2xl space-y-5">
      
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <div class="flex items-center space-x-2">
          <span class="text-lg">🔐</span>
          <h3 class="text-sm font-black text-slate-900 uppercase">Acceso Administrador</h3>
        </div>
        <button onclick="cerrarModalAdmin()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <form onsubmit="procesarLoginAdmin(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Usuario Admin:</label>
          <input type="text" id="adminUser" required placeholder="admin" value="admin" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Contraseña:</label>
          <input type="password" id="adminPass" required placeholder="••••••••" value="admin123" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="p-3 bg-blue-50 border border-blue-100 rounded-xl text-blue-800 text-[11px] font-medium">
          Acceso al Dashboard en vivo, gestión de mesas, usuarios y TV.
        </div>

        <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="cerrarModalAdmin()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow">
            Entrar
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- NOTIFICACIÓN TOAST -->
  <div id="toast" class="fixed bottom-6 right-6 hidden bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center space-x-2.5 z-50">
    <span id="toastIcon">🟢</span>
    <span id="toastMsg">Autenticando...</span>
  </div>

  <script>
    // SOPORTA HASTA 12 O MÁS MESAS SIN DESCUADRARSE NUNCA
    const mesasRed = [
      { id: 1, ocupadaPor: "Lic. Ana Gómez" },
      { id: 2, ocupadaPor: "Carlos Mendoza" },
      { id: 3, ocupadaPor: null }, // Libre (Elegida por defecto)
      { id: 4, ocupadaPor: "Pedro Vargas" },
      { id: 5, ocupadaPor: null },
      { id: 6, ocupadaPor: "Jorge Morales" },
      { id: 7, ocupadaPor: null },
      { id: 8, ocupadaPor: null },
      { id: 9, ocupadaPor: null },
      { id: 10, ocupadaPor: null },
      { id: 11, ocupadaPor: null },
      { id: 12, ocupadaPor: null }
    ];

    let mesaSeleccionada = 3;

    function renderGrillaMesas() {
      const container = document.getElementById('grillaMesasLogin');
      container.innerHTML = "";

      mesasRed.forEach(m => {
        const estaOcupada = m.ocupadaPor !== null;
        const esSeleccionada = m.id === mesaSeleccionada;

        const btn = document.createElement('button');
        btn.type = "button";
        btn.disabled = estaOcupada;

        let estilo = "bg-white border-2 border-slate-200 hover:border-blue-400 text-slate-700";
        let sub = "Libre";

        if (esSeleccionada) {
          estilo = "bg-blue-600 border-2 border-blue-600 text-white font-black shadow-md ring-2 ring-blue-300";
          sub = "Elegida";
        } else if (estaOcupada) {
          estilo = "bg-slate-100 border border-slate-200 text-slate-400 opacity-50 cursor-not-allowed";
          sub = m.ocupadaPor.split(' ')[0];
        }

        btn.className = `p-2 rounded-xl flex flex-col items-center justify-center transition-all ${estilo}`;
        btn.onclick = () => {
          mesaSeleccionada = m.id;
          document.getElementById('tagMesaElegida').textContent = `MESA ${m.id}`;
          renderGrillaMesas();
        };

        btn.innerHTML = `
          <span class="text-[9px] uppercase font-bold opacity-80">MESA</span>
          <span class="text-base font-black font-mono">${m.id}</span>
          <span class="text-[8px] truncate max-w-full">${sub}</span>
        `;
        container.appendChild(btn);
      });
    }

    function procesarLoginOperador(e) {
      e.preventDefault();
      const user = document.getElementById('inputUsuario').value.trim();

      mostrarToast(`Ingresando a MESA ${mesaSeleccionada}...`, "🚀");
      setTimeout(() => {
        window.location.href = "demo_panel_mesa.html";
      }, 700);
    }

    // MODAL DE ADMIN
    function abrirModalAdmin() {
      document.getElementById('modalLoginAdmin').classList.remove('hidden');
      document.getElementById('adminUser').focus();
    }

    function cerrarModalAdmin() {
      document.getElementById('modalLoginAdmin').classList.add('hidden');
    }

    function procesarLoginAdmin(e) {
      e.preventDefault();
      mostrarToast("Acceso de Administrador concedido. Abriendo Centro de Gestión...", "📊");
      setTimeout(() => {
        window.location.href = "demo_admin_config.html";
      }, 700);
    }

    function mostrarToast(msg, icon = "🟢") {
      const t = document.getElementById('toast');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    renderGrillaMesas();
  </script>
</body>
</html>
