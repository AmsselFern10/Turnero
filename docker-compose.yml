# =============================================================================
# Turnero de Matrículas 2026 — Docker Compose
# Servicios: PostgreSQL 15 · Redis 7 · pgBouncer · App Node.js 20
#
# Uso:
#   docker compose up           → Levanta todo (con logs)
#   docker compose up -d        → Levanta en background
#   docker compose down         → Detiene y elimina contenedores
#   docker compose down -v      → Detiene + elimina volúmenes (borra BD)
# =============================================================================

name: turnero

services:

  # ---------------------------------------------------------------------------
  # Base de datos — PostgreSQL 15
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: turnero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXPOSED:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Todas las migraciones 001..007 se ejecutan automáticamente en orden al crear la BD
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - turnero-net

  # ---------------------------------------------------------------------------
  # Caché y Pub/Sub — Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: turnero-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT_EXPOSED:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - turnero-net

  # ---------------------------------------------------------------------------
  # Pool de conexiones — pgBouncer
  # Protege PostgreSQL limitando conexiones reales a máx 10
  # La app se conecta al puerto 5433 (pgBouncer), nunca directamente a PG
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: turnero-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER:          ${DB_USER}
      DB_PASSWORD:      ${DB_PASSWORD}
      DB_HOST:          db
      DB_PORT:          5432
      DB_NAME:          ${DB_NAME}
      POOL_MODE:        transaction          # Modo transaccional — ideal para Fastify
      MAX_CLIENT_CONN:  100                  # Máx clientes que se conectan a pgBouncer
      DEFAULT_POOL_SIZE: 10                  # Máx conexiones reales a PostgreSQL
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE:        scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
    ports:
      - "${PGBOUNCER_PORT_EXPOSED:-5433}:5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - turnero-net

  # ---------------------------------------------------------------------------
  # Aplicación — Node.js 20 + Fastify
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: turnero-app
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV:         ${NODE_ENV:-development}
      PORT:             ${APP_PORT:-3000}
      # Base de datos — conectar via pgBouncer
      DATABASE_URL:     postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      # Redis
      REDIS_URL:        redis://:${REDIS_PASSWORD}@redis:6379
      # JWT
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRES_IN:   ${JWT_EXPIRES_IN:-2h}
      REFRESH_SECRET:   ${REFRESH_SECRET}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN:-7d}
      # Configuración
      BCRYPT_COST:      ${BCRYPT_COST:-12}
      LOG_LEVEL:        ${LOG_LEVEL:-info}
      APP_PORT_EXPOSED: ${APP_PORT_EXPOSED:-3000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      HOST_IP:          ${HOST_IP:-}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT_EXPOSED:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # En desarrollo: montar el código fuente para hot-reload y permitir uploads
      - ./src:/app/src
      - ./migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - turnero-net

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Red interna — los servicios se comunican por nombre de contenedor
# =============================================================================
networks:
  turnero-net:
    driver: bridge
